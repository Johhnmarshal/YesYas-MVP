name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting main. Stacked PRs based on
  # another branch were silently getting no CI at all: PR #6 opened against
  # fix/screen-capture-keys-and-deletion-flag ran the Vercel checks and nothing
  # else, so neither the typecheck nor the pgTAP suite covered it.
  pull_request:

jobs:
  verify:
    name: Verify Typecheck, Lint, Domain Logic & Web Export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint check
        run: npx eslint app/ components/ lib/

      - name: Verify domain logic & crypto invariants
        run: node --experimental-strip-types scripts/verify-domain-logic.ts

      - name: Expo web export
        run: npx expo export -p web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

  db-test:
    name: Supabase Migrations & pgTAP Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local instance
        run: supabase start

      - name: Run pgTAP database tests
        run: supabase test db

