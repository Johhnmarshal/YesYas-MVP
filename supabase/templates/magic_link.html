<!doctype html>
<html>
  <body style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; color: #1E293B; line-height: 1.5;">
    <h2 style="font-weight: 600;">Your sign-in code</h2>

    <p>Enter this code in the app:</p>
    <p style="font-size: 28px; letter-spacing: 6px; font-weight: 700; margin: 16px 0;">
      {{ .Token }}
    </p>

    <p>Or open this link on the device you want to sign in on:</p>
    <p>
      <a href="{{ .SiteURL }}/?token_hash={{ .TokenHash }}&type=email"
         style="display: inline-block; background: #1E293B; color: #ffffff; padding: 12px 20px; border-radius: 10px; text-decoration: none;">
        Sign in
      </a>
    </p>

    <p style="color: #5A6878; font-size: 13px;">
      The code and link both expire shortly. If you didn't ask to sign in, ignore this email — nothing will happen.
    </p>
  </body>
</html>
