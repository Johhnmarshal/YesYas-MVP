# Supabase local-dev config. Run `supabase init` once to generate the full
# file if you want to tweak ports/seeds — this minimal version is enough for
# `supabase db push` / `supabase test db` / `supabase start` out of the box.
project_id = "yesyas"

[db]
port = 54322
# Match the Postgres major version of the linked staging project so local dev
# behaves identically to production. If you re-link to a project on a newer
# Postgres major, bump this and run `supabase db reset`.
major_version = 17

# IMPORTANT: this [auth] block configures the LOCAL stack only. The hosted
# project has its own settings and does not read this file.
[auth]
enable_signup = true
enable_anonymous_sign_ins = false
site_url = "http://localhost:8081"
additional_redirect_urls = [
  "http://localhost:8081",
  "http://localhost:8081/**",
  "yesyasapp://",
  "yesyasapp://**",
]

[auth.email]
enable_confirmations = true

# The default Supabase magic-link template carries only {{ .ConfirmationURL }}.
# That breaks two things at once: the in-app OTP box asks for a code that was
# never sent, and the link cannot carry a token_hash, which is what lets web
# use PKCE without failing when the link opens in a different browser than
# requested it.
[auth.email.template.magic_link]
subject = "Your sign-in code"
content_path = "./supabase/templates/magic_link.html"

[studio]
port = 54323

# ---------------------------------------------------------------------------
# Hosted project overrides.
#
# The [auth] block above is the LOCAL stack. This block is what
# `supabase config push --project-ref flauqfikspnywcvtevnq` sends to the hosted
# project, so the production URL configuration lives in version control rather
# than as undocumented dashboard state that nobody can diff or review.
# ---------------------------------------------------------------------------
[remotes.production]
project_id = "flauqfikspnywcvtevnq"

[remotes.production.auth]
enable_signup = true
enable_anonymous_sign_ins = false
# The passphrase path was added to work around the built-in SMTP cap, which
# means accounts holding encrypted journals can now be reached with a password.
# Supabase's default floor is 6 characters, and leaked-password protection is
# off on this project, so "123456" was acceptable. 12 plus mixed classes is the
# minimum defensible for this data.
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"
site_url = "https://yesyas.vercel.app"
# Every entry here is a place a magic link may deliver its token, so the list
# is an authorisation boundary rather than a convenience.
#
# "https://*.vercel.app" and "https://*.vercel.app/**" used to be in it, and
# they were an account-takeover vector. Supabase honours wildcards in the host,
# and vercel.app is a shared public domain anyone can deploy to:
#
#   1. signInWithOtp is a client call. Anyone holding the publishable anon key
#      — which ships in the web bundle — can send their own, with any
#      emailRedirectTo they like.
#   2. Supabase validates that value against site_url plus this list, so
#      https://whatever-they-own.vercel.app was accepted.
#   3. The victim receives a GENUINE YesYas sign-in email from the real sender
#      and clicks it, because there is nothing wrong with it.
#   4. The code lands on the attacker's origin, which exchanges it for a
#      session.
#
# Nothing in this repository needs a preview host: the only Vercel URL
# referenced anywhere is yesyas.vercel.app, and the client sends
# window.location.origin, so a legitimate deploy is already covered.
#
# If a preview deployment ever does need to sign in, add that exact URL, or at
# narrowest the scoped form Supabase's own docs recommend —
# "https://yesyas-*-<your-team-slug>.vercel.app" — never a bare *.vercel.app.
additional_redirect_urls = [
  "https://yesyas.vercel.app",
  "https://yesyas.vercel.app/**",
  "yesyasapp://",
  "yesyasapp://**",
  "http://localhost:8081",
  "http://localhost:8081/**",
]

[remotes.production.auth.email]
enable_confirmations = false
# Supabase's default is 60s; this was "1s", which is convenient while testing
# and an abuse lever once real SMTP is attached — one address can be mailed as
# fast as requests arrive. sign-in.tsx already holds its own 60-second cooldown
# after a send, so matching it here costs a tester nothing and removes the
# server-side hole.
max_frequency = "60s"
otp_length = 8

# Supabase's stock magic-link template carries only {{ .ConfirmationURL }},
# which breaks two paths at once: the in-app OTP box asks for a code that was
# never sent, and the link cannot carry a token_hash — the thing that lets web
# use PKCE without failing when the link is opened in a different browser than
# the one that requested it.
# Custom SMTP. Supabase's built-in mailer is explicitly not a production
# service: it is capped at a couple of sends per hour and shared across every
# free project. The hosted auth logs for 2026-10-24 22:00 show 2 sends through
# and 11 rejected with "429 email rate limit exceeded" — with one person
# testing. At fifty couples nobody signs in.
#
# This block is complete apart from the credential. To turn it on:
#   1. Create a sender on any SMTP provider (Resend, SES, Postmark) and verify
#      the sending domain — unverified senders land in spam, which for this
#      app reads as the product being broken.
#   2. export SUPABASE_AUTH_SMTP_PASS=<the API key>
#   3. supabase config push --project-ref flauqfikspnywcvtevnq
#
# The password is read from the environment, never committed. Fill in host,
# port, user and the sender fields for whichever provider you choose; the
# values below are Resend's.
#
# Once mail is reliable, set enable_confirmations back to true above. That is
# what makes account creation prove the caller owns the address — until then
# signup is open, which is why sign-in.tsx no longer calls signUp implicitly.
#
# [remotes.production.auth.email.smtp]
# enabled = true
# host = "smtp.resend.com"
# port = 465
# user = "resend"
# pass = "env(SUPABASE_AUTH_SMTP_PASS)"
# admin_email = "no-reply@yourdomain"
# sender_name = "YesYas"

[remotes.production.auth.email.template.magic_link]
subject = "Your sign-in code"
content_path = "./supabase/templates/magic_link.html"

[remotes.production.auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
